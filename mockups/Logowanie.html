<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>13. Telefon – logowanie – makieta</title>
<!-- Makieta: 13. Telefon – logowanie | telefon 390 px | kolor akcentu #C2410C -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C2430}a:hover{color:#000000}
</style>
<style>html{background:#E5E1D8} body>div{margin:0 auto; box-shadow:0 0 0 1px #D5CFC3}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F3EE; font-family: Inter, system-ui, sans-serif; color: #1C2430; display: flex; flex-direction: column">
  <header style="padding: 20px 20px 0 20px">
    <a href="Start.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 500; text-decoration: none; color: #5A6372">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6372" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Wróć
    </a>
  </header>

  <section style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700; color: #C2410C">Wycenka</span>
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Zaloguj się</h1>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #3F4856">Wyślemy kod SMS. Bez hasła do zapamiętania.</p>
  </section>

  <form style="margin: 24px 20px 0 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="tel" style="font-size: 13px; font-weight: 600; color: #3F4856">Numer telefonu</label>
      <div style="display: flex; gap: 8px">
        <span style="min-height: 52px; padding: 0 12px; border: 1px solid #D5CFC3; border-radius: 12px; background: #ECE8DF; display: flex; align-items: center; font-size: 16px; color: #3F4856">+48</span>
        <input id="tel" type="tel" autocomplete="tel-national" value="600 000 000" style="flex-grow: 1; min-width: 0; min-height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #D5CFC3; border-radius: 12px; background: #FFFFFF; font: 400 17px Inter, sans-serif; color: #1C2430">
      </div>
    </div>
    <p style="margin: 0; padding: 10px 12px; border-radius: 10px; background: #E3F2E7; font-size: 13px; color: #1E6B34">Kod wysłany. Wpisz go poniżej.</p>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="kod" style="font-size: 13px; font-weight: 600; color: #3F4856">Kod z SMS-a</label>
      <input id="kod" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 cyfr" style="min-height: 56px; box-sizing: border-box; padding: 0 14px; border: 2px solid #1C2430; border-radius: 12px; background: #FFFFFF; font: 600 22px Inter, sans-serif; letter-spacing: 8px; color: #1C2430">
      <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0; border: none; background: transparent; font: 500 14px Inter, sans-serif; color: #5A6372">Wyślij ponownie za 0:42</button>
    </div>
    <a href="Main.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #C2410C; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600">Zaloguj</a>
  </form>

  <div style="margin: 20px 20px 0 20px; display: flex; align-items: center; gap: 12px; color: #5A6372; font-size: 13px" aria-hidden="true"><div style="flex-grow: 1; height: 1px; background: #DDD7CC"></div>lub<div style="flex-grow: 1; height: 1px; background: #DDD7CC"></div></div>
  <div style="margin: 16px 20px 0 20px">
    <button type="button" style="width: 100%; min-height: 52px; border-radius: 14px; border: 1px solid #D5CFC3; background: #FFFFFF; color: #1C2430; font: 600 15px Inter, sans-serif">Zaloguj adresem e-mail</button>
  </div>

  <div style="flex-grow: 1"></div>

  <footer style="padding: 20px 20px 28px 20px; display: flex; flex-direction: column; gap: 8px; align-items: center">
    <a href="Profesja.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #1C2430">Nie masz konta? Załóż je w 2 minuty</a>
    <p style="margin: 0; font-size: 12px; line-height: 17px; color: #5A6372; text-align: center">Logując się, akceptujesz regulamin i politykę prywatności.</p>
  </footer>
</div>
</body>
</html>
