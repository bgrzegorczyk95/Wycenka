<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5. Wybór profesji – makieta</title>
<!-- Makieta: 5. Wybór profesji | telefon 390 px | kolor akcentu #C2410C -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C2430}a:hover{color:#000000}
</style>
<style>html{background:#E5E1D8} body>div{margin:0 auto; box-shadow:0 0 0 1px #D5CFC3}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F3EE; font-family: Inter, system-ui, sans-serif; color: #1C2430; display: flex; flex-direction: column">
  <header style="padding: 28px 20px 16px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
      <div style="height: 4px; border-radius: 2px; background: #C2410C"></div>
      <div style="height: 4px; border-radius: 2px; background: #DDD7CC"></div>
      <div style="height: 4px; border-radius: 2px; background: #DDD7CC"></div>
    </div>
    <p style="margin: 0; font-size: 13px; color: #5A6372">Krok 1 z 3</p>
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Czym się zajmujesz?</h1>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #3F4856">Dobierzemy gotową listę prac. Ceny wpiszesz swoje – nie podpowiadamy stawek.</p>
  </header>

  <fieldset style="margin: 0 20px; padding: 0; border: none">
    <legend style="font-size: 13px; font-weight: 600; color: #5A6372; margin-bottom: 10px">Możesz zaznaczyć kilka</legend>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="min-height: 84px; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 2px solid #C2410C; background: #FDF1EA; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600">Glazurnik</span><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0"></span>
        <span style="font-size: 12px; line-height: 16px; color: #3F4856">płytki, hydroizolacja, biały montaż</span>
      </label>
      <label style="min-height: 84px; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 1px solid #DDD7CC; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600">Malarz</span><input type="checkbox" style="width: 18px; height: 18px; margin: 0"></span>
        <span style="font-size: 12px; line-height: 16px; color: #5A6372">gładzie, malowanie, tapety</span>
      </label>
      <label style="min-height: 84px; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 1px solid #DDD7CC; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600">Elektryk</span><input type="checkbox" style="width: 18px; height: 18px; margin: 0"></span>
        <span style="font-size: 12px; line-height: 16px; color: #5A6372">instalacje, osprzęt, pomiary</span>
      </label>
      <label style="min-height: 84px; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 1px solid #DDD7CC; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600">Hydraulik</span><input type="checkbox" style="width: 18px; height: 18px; margin: 0"></span>
        <span style="font-size: 12px; line-height: 16px; color: #5A6372">wod-kan, c.o., biały montaż</span>
      </label>
      <label style="min-height: 84px; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 1px solid #DDD7CC; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600">Suche zabudowy</span><input type="checkbox" style="width: 18px; height: 18px; margin: 0"></span>
        <span style="font-size: 12px; line-height: 16px; color: #5A6372">G-K, sufity, ścianki</span>
      </label>
      <label style="min-height: 84px; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 1px solid #DDD7CC; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600">Podłogi</span><input type="checkbox" style="width: 18px; height: 18px; margin: 0"></span>
        <span style="font-size: 12px; line-height: 16px; color: #5A6372">panele, deski, wylewki</span>
      </label>
      <label style="min-height: 84px; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 1px solid #DDD7CC; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600">Okna i drzwi</span><input type="checkbox" style="width: 18px; height: 18px; margin: 0"></span>
        <span style="font-size: 12px; line-height: 16px; color: #5A6372">montaż, regulacja, parapety</span>
      </label>
      <label style="min-height: 84px; box-sizing: border-box; padding: 12px; border-radius: 14px; border: 1px solid #DDD7CC; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; gap: 6px"><span style="font-size: 15px; font-weight: 600">Ekipa remontowa</span><input type="checkbox" style="width: 18px; height: 18px; margin: 0"></span>
        <span style="font-size: 12px; line-height: 16px; color: #5A6372">kompleksowe remonty</span>
      </label>
    </div>
    <button type="button" style="margin-top: 10px; width: 100%; min-height: 48px; border-radius: 14px; border: 1px dashed #B9B1A2; background: transparent; font: 500 14px Inter, sans-serif; color: #3F4856">Inna profesja – opisz własnymi słowami</button>
  </fieldset>

  <div style="flex-grow: 1"></div>

  <div style="padding: 0 20px 28px 20px">
    <a href="Stawki.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #1C2430; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600">Dalej</a>
  </div>
</div>
</body>
</html>
