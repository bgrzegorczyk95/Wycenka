<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16. Dane firmy (krok 3 z 3) – makieta</title>
<!-- Makieta: 16. Dane firmy (krok 3 z 3) | telefon 390 px | kolor akcentu #C2410C -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C2430}a:hover{color:#000000}
</style>
<style>html{background:#E5E1D8} body>div{margin:0 auto; box-shadow:0 0 0 1px #D5CFC3}</style>
</head>
<body>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #F5F3EE; font-family: Inter, system-ui, sans-serif; color: #1C2430; display: flex; flex-direction: column">
  <header style="padding: 28px 20px 14px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" aria-hidden="true">
      <div style="height: 4px; border-radius: 2px; background: #C2410C"></div>
      <div style="height: 4px; border-radius: 2px; background: #C2410C"></div>
      <div style="height: 4px; border-radius: 2px; background: #C2410C"></div>
    </div>
    <a href="Stawki.html" style="font-size: 13px; color: #5A6372; text-decoration: none">Krok 3 z 3</a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Dane firmy</h1>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #3F4856">Pojawią się na każdej ofercie. Wszystko zmienisz później w ustawieniach.</p>
  </header>

  <form style="margin: 0 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 14px; padding: 14px; background: #FFFFFF; border: 1px solid #E3DED4; border-radius: 14px">
      <div role="img" aria-label="Miejsce na logo" style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 14px; border: 1px dashed #B9B1A2; background: #FAF8F4; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A6372" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <button type="button" style="align-self: flex-start; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #D5CFC3; background: #FFFFFF; font: 600 14px Inter, sans-serif; color: #1C2430">Dodaj logo</button>
        <span style="font-size: 12px; color: #5A6372">PNG lub JPG. Możesz pominąć.</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="f-nazwa" style="font-size: 13px; font-weight: 600; color: #3F4856">Nazwa firmy</label>
      <input id="f-nazwa" type="text" value="Usługi Glazurnicze Nowak" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D5CFC3; border-radius: 10px; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #1C2430">
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="f-nip" style="font-size: 13px; font-weight: 600; color: #3F4856">NIP</label>
        <input id="f-nip" type="text" inputmode="numeric" placeholder="000-000-00-00" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D5CFC3; border-radius: 10px; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #1C2430">
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="f-tel" style="font-size: 13px; font-weight: 600; color: #3F4856">Telefon</label>
        <input id="f-tel" type="tel" value="600 000 000" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D5CFC3; border-radius: 10px; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #1C2430">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="f-obszar" style="font-size: 13px; font-weight: 600; color: #3F4856">Obszar działania</label>
      <input id="f-obszar" type="text" value="Warszawa i okolice" style="min-height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D5CFC3; border-radius: 10px; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #1C2430">
    </div>

    <fieldset style="margin: 6px 0 0 0; padding: 4px 14px 14px 14px; border: 1px solid #E3DED4; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
      <legend style="padding: 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #5A6372">Domyślne warunki oferty</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="f-waznosc" style="font-size: 13px; font-weight: 600; color: #3F4856">Ważność oferty</label>
          <select id="f-waznosc" style="min-height: 48px; padding: 0 10px; border: 1px solid #D5CFC3; border-radius: 10px; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #1C2430"><option>7 dni</option><option selected>14 dni</option><option>30 dni</option></select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="f-zaliczka" style="font-size: 13px; font-weight: 600; color: #3F4856">Zaliczka</label>
          <select id="f-zaliczka" style="min-height: 48px; padding: 0 10px; border: 1px solid #D5CFC3; border-radius: 10px; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #1C2430"><option>brak</option><option>20%</option><option selected>30%</option><option>50%</option></select>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="f-vat" style="font-size: 13px; font-weight: 600; color: #3F4856">Stawka VAT</label>
        <select id="f-vat" style="min-height: 48px; padding: 0 10px; border: 1px solid #D5CFC3; border-radius: 10px; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #1C2430"><option selected>8%</option><option>23%</option><option>zwolniony z VAT</option></select>
        <span style="font-size: 12px; line-height: 17px; color: #5A6372">Stawkę ustal z księgową – zależy od rodzaju prac i budynku. Możesz ją zmienić w każdej ofercie.</span>
      </div>
    </fieldset>
  </form>

  <div style="flex-grow: 1"></div>

  <div style="padding: 20px 20px 28px 20px">
    <a href="Main.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #C2410C; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600">Gotowe – zrób pierwszą ofertę</a>
  </div>
</div>
</body>
</html>
