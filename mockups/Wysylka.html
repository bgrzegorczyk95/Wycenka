<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>19. Podgląd i wysyłka – makieta</title>
<!-- Makieta: 19. Podgląd i wysyłka | telefon 390 px | kolor akcentu #C2410C -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C2430}a:hover{color:#000000}
</style>
<style>html{background:#E5E1D8} body>div{margin:0 auto; box-shadow:0 0 0 1px #D5CFC3}</style>
</head>
<body>
<div style="width: 390px; height: 1160px; box-sizing: border-box; background: #F5F3EE; font-family: Inter, system-ui, sans-serif; color: #1C2430; display: flex; flex-direction: column">
  <header style="padding: 20px 20px 12px 20px; display: flex; flex-direction: column; gap: 6px">
    <a href="Pozycje.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 500; text-decoration: none; color: #5A6372">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6372" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Pozycje
    </a>
    <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Podgląd i wysyłka</h1>
  </header>

  <section aria-label="Podgląd oferty" style="margin: 0 20px; background: #FFFFFF; border: 1px solid #E3DED4; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div role="img" aria-label="Logo firmy" style="width: 32px; height: 32px; border-radius: 8px; background: #1C2430; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">UN</div>
      <div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 600">Usługi Glazurnicze Nowak</span><span style="font-size: 11px; color: #5A6372">Oferta nr 2026/11/014</span></div>
    </div>
    <span style="font-size: 16px; font-weight: 700">Remont łazienki</span>
    <div style="display: flex; flex-direction: column; gap: 6px" aria-hidden="true">
      <div style="height: 8px; width: 92%; border-radius: 4px; background: #EEEAE2"></div>
      <div style="height: 8px; width: 78%; border-radius: 4px; background: #EEEAE2"></div>
      <div style="height: 8px; width: 85%; border-radius: 4px; background: #EEEAE2"></div>
      <div style="height: 8px; width: 64%; border-radius: 4px; background: #EEEAE2"></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px; border-top: 1px solid #EEEAE2"><span style="font-size: 13px; color: #5A6372">5 pozycji · brutto</span><span style="font-size: 18px; font-weight: 700">8 931,60 zł</span></div>
    <button type="button" style="align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #D5CFC3; background: #FFFFFF; font: 600 13px Inter, sans-serif; color: #1C2430">Otwórz PDF</button>
  </section>

  <fieldset style="margin: 14px 20px 0 20px; padding: 4px 14px 14px 14px; border: 1px solid #E3DED4; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
    <legend style="padding: 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #5A6372">Warunki</legend>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 4px"><label for="w-wazna" style="font-size: 13px; font-weight: 600; color: #3F4856">Ważna do</label><input id="w-wazna" type="text" value="27.11.2026" style="min-height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #D5CFC3; border-radius: 10px; font: 400 15px Inter, sans-serif; color: #1C2430"></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><label for="w-zal" style="font-size: 13px; font-weight: 600; color: #3F4856">Zaliczka</label><input id="w-zal" type="text" value="30%" style="min-height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #D5CFC3; border-radius: 10px; font: 400 15px Inter, sans-serif; color: #1C2430"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="w-start" style="font-size: 13px; font-weight: 600; color: #3F4856">Rozpoczęcie</label><input id="w-start" type="text" value="od 2 grudnia 2026" style="min-height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #D5CFC3; border-radius: 10px; font: 400 15px Inter, sans-serif; color: #1C2430"></div>
    <div style="display: flex; flex-direction: column; gap: 4px"><label for="w-uwagi" style="font-size: 13px; font-weight: 600; color: #3F4856">Uwagi dla klienta (opcjonalnie)</label><textarea id="w-uwagi" rows="2" placeholder="np. utylizacja gruzu po stronie klienta" style="box-sizing: border-box; padding: 10px; border: 1px solid #D5CFC3; border-radius: 10px; font: 400 15px Inter, sans-serif; color: #1C2430; resize: none"></textarea></div>
  </fieldset>

  <fieldset style="margin: 14px 20px 0 20px; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
    <legend style="font-size: 13px; font-weight: 600; color: #5A6372; margin-bottom: 8px">Wyślij przez</legend>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <label style="min-height: 48px; border-radius: 12px; border: 2px solid #C2410C; background: #FDF1EA; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600"><input type="radio" name="kanal" checked style="margin: 0">SMS</label>
      <label style="min-height: 48px; border-radius: 12px; border: 1px solid #DDD7CC; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500"><input type="radio" name="kanal" style="margin: 0">WhatsApp</label>
      <label style="min-height: 48px; border-radius: 12px; border: 1px solid #DDD7CC; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500"><input type="radio" name="kanal" style="margin: 0">E-mail</label>
    </div>
  </fieldset>

  <section aria-label="Treść wiadomości" style="margin: 12px 20px 0 20px; padding: 12px 14px; border-radius: 12px; background: #ECE8DF; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 600; color: #3F4856">Do: Anna Kowalska</span>
    <span style="font-size: 14px; line-height: 20px; color: #1C2430">Dzień dobry, przesyłam ofertę na remont łazienki: wycenka.pl/o/x7k2p9. Pozdrawiam, Marek Nowak</span>
  </section>

  <div style="flex-grow: 1"></div>

  <div style="padding: 20px 20px 28px 20px; display: flex; flex-direction: column; gap: 8px">
    <a href="Klient.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: #C2410C; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600">Wyślij ofertę</a>
    <button type="button" style="min-height: 44px; border: none; background: transparent; font: 600 14px Inter, sans-serif; color: #3F4856">Kopiuj link</button>
  </div>
</div>
</body>
</html>
